000627,|,F,|,ppApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,VLC Media Player,|,v3.0.23,|,Video;,|,Audio Playing; Video Playing;,|,VLC is a free and open source cross-platform multimedia player and framework, that plays most multimedias files, medias and streaming protocols. It is simple to use, yet very powerful and extendable.VLC media player is a highly portable multimedia player supporting most audio and video formats (H.264, Ogg, DivX, MKV, TS, MPEG-2, mp3, MPEG-4, aac, etc.) from files, physical media (DVDs, VCD, Audio-CD), TV capture cards and many network streaming protocols. It doesn't need any external codec, program, or codec pack to work.* Added plugin to allow left click to toggle pausing video and Status Bar shown by default to set speed of playback.,|,http://www.videolan.org|http://download.videolan.org/pub/vlc,|,5,|,%ppApps%/VLC.Media.Player,|,%URLPath%/VLC.Media.Player_v3.0.23_x64+x86_ppApp.apz,|,%DBPath%/VLC.Media.Player_v3.0.23_x64+x86_ppApp.apz,|,,|,%DBPath%/.lldb/vlcmediaplayerppapp.png,|,589,|,%DBPath%/.lldb/vlcmediaplayerppapp.jpg,|,%DBPath%/.lldb/vlcmediaplayerppapp.png,|,,|,keepall,|,Playing|CodeC|Audio|Video,|,VideoLAN,|,,|,5,|,,|,,|,3,|,3.0.21,|,2026-01-13,|,,|,,|,375562,|,VLC Media Player {#1},|,Multimedia player that suppors most audio and video formats.,|,,|,Audio Playing; Video Playing;,|,%ppApps%/VLC.Media.Player,|,_x86\vlc.exe,|,,|,Is_x86,|,,|,F,|,F,|,,|,,|,,|,,|,,|,,|,False,|,,|,Explorer,|,winget,|,x86 + x64,|,vlcmediaplayerppapp,|,,|,
000628,|,F,|,LLApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,DaVinci Resolve,|,v20.3.0,|,Video;,|,,|,DaVinci Resolve is a proprietary color grading, color correction, visual effects, and audio post-production video editing application for macOS, Windows, and Linux, developed by Blackmagic Design.DaVinci Resolve has been used for the color grading and/or editing of feature films such as Alien: Covenant, Avatar, Best of Enemies, Deadpool 2, Jason Bourne, Kingsman: The Golden Circle, La La Land, Love & Mercy, Pirates of the Caribbean, Prometheus, Robin Hood, Spectre, Star Wars: The Last Jedi, and X-Men, plus many moreTo make the DPI scaling work for tiny UI:Launch DaVinci Resolve.Go to the DaVinci Resolve menu in the top left and select Preferences.In the Preferences window, select the User tab.Navigate to the UI Settings section.Find the UI Display Scale option.Change the scale from 100% to a higher value, such as 150% or 200%, depending on your monitor's resolution and size.Click Save and restart DaVinci Resolve for the new scaling to be applied.,|,https://www.blackmagicdesign.com/au/products/davinciresolve,|,5,|,/opt/resolve,|,%URLPath%/DaVinci.Resolve_v20.3.0_x64_LLApp.tar,|,%DBPath%/DaVinci.Resolve_v20.3.0_x64_LLApp.tar,|,,|,%DBPath%/.lldb/davinciresolvellapp.png,|,590,|,%DBPath%/.lldb/davinciresolvellapp.jpg,|,%DBPath%/.lldb/davinciresolvellapp.png,|,,|,noinstall,|,,|,Blackmagic,|,,|,4,|,,|,,|,2,|,,|,,|,,|,Glenn,|,3600000,|,,|,,|,,|,,|,/opt/resolve,|,,|,,|,,|,,|,F,|,F,|,,|,,|,,|,,|,,|,,|,True,|,,|,All-Linux,|,apt,|,x64,|,davinciresolvellapp,|,,|,
000629,|,F,|,LLApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,Stellarium,|,v25.3,|,Astronomy;,|,,|,Stellarium renders 3D photo-realistic skies in real time with OpenGL. It displays stars, constellations, planets, nebulae and others things like ground, landscape, atmosphere, etc.FeaturesRealistic simulation of the sky, sunrise and sunsetDefault catalogue of over 600,000 starsDownloadable additional catalogues for up to 210 million starsCatalog data for all New General Catalogue (NGC) objectsImages of almost all Messier objects and the Milky WayArtistic illustrations for all 88 modern constellationsMore than a dozen different cultures with their constellationsSolar and lunar eclipse simulationPhotorealistic landscapes (more are available on the website)Scripting support with ECMAScript (a few demo scripts are included)Extendable with plug-ins: 21 plug-ins installed by default, including:artificial satellites plug-in (updated from an on-line TLE database)ocular simulation plug-in (shows how objects look like in a given ocular)Solar System editor plug-in (imports comet and asteroid data from the MPC)telescope control plug-in (Meade LX200 and Celestron NexStar compatible)Remote control via web interface plug-in3D landscapes plug-in,|,https://github.com/Stellarium/stellarium/releases,|,5,|,%LLApps%/Stellarium,|,%URLPath%/Stellarium_v25.3_x64_LLApp.tar,|,%DBPath%/Stellarium_v25.3_x64_LLApp.tar,|,,|,%DBPath%/.lldb/stellariumllapp.png,|,591,|,%DBPath%/.lldb/stellariumllapp.jpg,|,%DBPath%/.lldb/stellariumllapp.png,|,,|,,|,,|,,|,,|,3,|,,|,,|,3,|,,|,2026-03-01,|,,|,Glenn,|,504744591,|,Stellarium,|,,|,,|,Astronomy;,|,%LLApps%/Stellarium,|,%LLApps%/Stellarium/Stellarium-25.3-qt6-x86_64.AppImage,|,,|,,|,,|,F,|,F,|,,|,/home/glenn/LLApps/Stellarium/LLApp.png,|,,|,,|,,|,,|,False,|,,|,All-Linux,|,All,|,x64,|,stellariumllapp,|,,|,
000630,|,F,|,LLApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,Kdenlive - AppImage,|,v25.08.3,|,Video;,|,,|,Kdenlive (KDE Non-Linear Video Editor) is an Open Source video editor built on Qt and KDE Framework libraries.The MLT Framework does most of the video processing in Kdenlive, which relies on many other Open-Source projects, such as FFmpeg, frei0r, movie, ladspa, and sox.Kdenlive was designed with a robust feature set to meet users' needs, from performing basic video editing to professional work.Kdenlive supports all formats supported by FFmpeg or libav (such as QuickTime, AVI, WMV, MPEG, and Flash Video, among others) and supports 4:3 and 16:9 aspect ratios for both PAL, NTSC, and various HD standards, including HDV and AVCHD. Video can also be exported to DV devices or written to a DVD with chapters and a simple menu. There is also a detailed User Manual to help get you started.Kdenlive Features:- Multi-track editing with a timeline and supports an unlimited number of video and audio tracks.- A built-in title editor and tools to create, move, crop, and delete video, audio, text, and image clips.- Ability to add custom effects and transitions.- A wide range of effects and transitions. Audio effects include normalization, phase, pitch shifting, limiting, volume adjustment, reverb, and equalization filters.- Visual effects include options for masking, blue-screen, distortions, rotations, color tools, blurring, obscuring, and others.- Configurable keyboard shortcuts and interface layouts.- Rendering uses a separate non-blocking process to stop, pause, and restart.- Kdenlive also provides a script called the Kdenlive Builder Wizard (KBW) that compiles the latest developer version of the software and its main dependencies from the source to allow users to try to test new features and report problems on the bug tracker.,|,https://kdenlive.org,|,5,|,%LLApps%/Kdenlive,|,%URLPath%/Kdenlive.-.AppImage_v25.08.3_x64_LLApp.tar,|,%DBPath%/Kdenlive.-.AppImage_v25.08.3_x64_LLApp.tar,|,,|,%DBPath%/.lldb/kdenlive-appimagellapp.png,|,592,|,%DBPath%/.lldb/kdenlive-appimagellapp.jpg,|,%DBPath%/.lldb/kdenlive-appimagellapp.png,|,,|,,|,,|,,|,,|,4,|,,|,,|,3,|,,|,2026-03-01,|,,|,Glenn,|,195247764,|,Kdenlive,|,Video Editor,|,,|,,|,%LLApps%/Kdenlive/,|,%LLApps%/Kdenlive/kdenlive-25.08.3-x86_64.AppImage,|,,|,,|,,|,F,|,F,|,,|,/home/glenn/LLApps/Kdenlive/LLApp.png,|,,|,,|,,|,,|,False,|,,|,All-Linux,|,All,|,x64,|,kdenlive-appimagellapp,|,,|,
