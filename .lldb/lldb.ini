000646,|,F,|,ppApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,Foxit PDF Editor Pro (Lite),|,v14.0.2.33402,|,Office;,|,Office Word Processing; Office Converting; Office Scanning; Office Viewing;,|,Foxit PDF Editor Pro (formerly Foxit PhantomPDF) is a business-ready PDF toolkit to create professional looking PDF documents and forms. Foxit PDF creator allows you to produce great looking PDF document and forms quickly, affordably, and securely. This Foxit software can combine, split or repackage various PDF files. The documents can be merged or split based on page numbers, page outlines or bookmarks. Plus, this Suite can batch convert existing documents to a single or multiple PDF files.[ppApp note: This is a Lite version of Foxit PDF Editor, with various plugins removed (mostly pertaining to online functionality. The internal .msi of the Foxit PDF Editor .exe installer unpacks to ProgramData\Package Cache. Link to the respective version of the Foxit PDF Printer driver .msi installer is included in the URL section; update version numbers as required for future ppApp builds. The latest one as of making this ppApp is included in the root dir of the ppApp as "EditorCreator_v2024.4.1.27687.msi". Install this if you want to use the virtual printer driver to print to/as PDF.],|,https://www.foxit.com/pdf-editor|https://cdn01.foxitsoftware.com/product/phantomPDF/desktop/win/2024.4.1/EditorCreator_v2024.4.1.27687.msi,|,5,|,%ppApps%/Foxit.PDF.Editor,|,%URLPath%/Foxit.PDF.Editor.Pro.(Lite)_v14.0.2.33402_x64_ppApp.apz,|,%DBPath%/Foxit.PDF.Editor.Pro.(Lite)_v14.0.2.33402_x64_ppApp.apz,|,,|,%DBPath%/.lldb/foxitpdfeditorpro(lite)ppapp.png,|,608,|,%DBPath%/.lldb/foxitpdfeditorpro(lite)ppapp.jpg,|,%DBPath%/.lldb/foxitpdfeditorpro(lite)ppapp.png,|,,|,keepall,|,Office|OCR|Conversion|Scanning|Printing,|,Foxit Software,|,,|,4,|,,|,,|,1,|,14.0.2.33402,|,2026-03-01,|,,|,,|,722130310,|,Foxit PDF Editor,|,Foxit PDF Editor Pro is a PDF toolkit to create professional looking PDF documents and fo