hen a client requests a piece of media, the server looks at the client’s capabilities, compares them to the media parameters, and makes a determination as to whether or not the file can be directly played on the device. For example, if you have a properly prepared MP4 file, it’ll play without any transcoding on an iOS device. Tiny CPU usage, and no loss in quality. If you had a movie in MKV format and also encoded it for mobile devices (and both versions scanned into your library), the media server is smart enough to mark the specific version of the file as playable by the device.* Direct StreamingMost of these devices support hardware decoding of the H.264 codec, but may not support a particular file format. When a client connects to the Plex Media Server, it describes its capabilities, and if the file falls within the acceptable range, the video is simply copied over to a compatible format (a process known as re-muxing). This again means that there is very little CPU used on the server side, and no loss in quality in the video. Streams start up nearly instantly, and seek quickly.* Smart TranscodingTranscoding is handled smartly. If you have a media file that is partly compatible with the Client - maybe the video portion is correct but the audio is not - the process is smart enough to only transcode what's necessary and stream that to the client.To move the database open command prompt:mklink /D "C:\Users\User\AppData\Local\Plex Media Server" "D:\Plex Media Server\Plex Media Server",|,http://www.plexapp.com,|,5,|,$HOME/.wine/drive_c/Program Files/Plex/Plex Media Server,|,%URLPath%/Plex.Media.Server_v1.42.2.10156_x64_ssApp.apz,|,%DBPath%/Plex.Media.Server_v1.42.2.10156_x64_ssApp.apz,|,,|,%DBPath%/.lldb/plexmediaserverssapp.png,|,588,|,%DBPath%/.lldb/plexmediaserverssapp.jpg,|,%DBPath%/.lldb/plexmediaserverssapp.png,|,,|,keepall,|,Streaming|Channel|Server|Library|Video,|,Plex,|,,|,5,|,,|,,|,2,|,1.42.2.10156,|,2026-01-12,|,,|,Glenn,|,98008,|,Plex Media Serve