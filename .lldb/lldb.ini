000641,|,F,|,ssApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,Windows Essentials Photo Gallery And Movie Maker,|,v16.4.3528,|,Graphics;,|,Graphics;,|,Do more with Windows on your PC with free programs from Microsoft for photos, movies, instant messaging, email, social networking, and more.Messenger* Stay in touch with the people you care about most from your PC, phone, or the web. Share photos and videos as you chat, and see the latest updates from your friends.Photo Gallery* Get great tools for organizing, touching up, and sharing your photos and videos. Create stunning panoramas, movies, and slide shows, and publish them online.Movie Maker* Turn your photos and videos into polished movies that are easy to share. Add special effects, transitions, sound, and captions to help tell your story in style.Windows Live Mesh* Keep photos and documents in sync between your computers, and on SkyDrive. Connect remotely to all of the files and programs on your PCs.Writer* Blog like a pro, adding photos, videos, maps, and more.Family Safety* Parental controls to help parents keep their children safe online.Mail* Manage multiple email accounts, calendars, and your contacts, even when you're offline.Microsoft Silverlight* Access rich, interactive websites using the Silverlight browser plug-in.,|,http://explore.live.com/windows-live-essentials,|,5,|,$HOME/.wine/drive_c/Program Files/Windows Live,|,%URLPath%/Windows.Essentials.Photo.Gallery.And.Movie.Maker_v16.4.3528_x64+x86_ssApp.apz,|,%DBPath%/Windows.Essentials.Photo.Gallery.And.Movie.Maker_v16.4.3528_x64+x86_ssApp.apz,|,,|,%DBPath%/.lldb/windowsessentialsphotogalleryandmoviemakerssapp.png,|,603,|,%DBPath%/.lldb/windowsessentialsphotogalleryandmoviemakerssapp.jpg,|,%DBPath%/.lldb/windowsessentialsphotogalleryandmoviemakerssapp.png,|,,|,keepall keepinfolder,|,Instant Photo|Tagging|Editing|Collection|Library,|,Microsoft,|,,|,4,|,,|,,|,2,|,,|,2026-01-13,|,,|,Glenn,|,134226,|,Movie Maker {#1},|,,|,,|,Graphics;,