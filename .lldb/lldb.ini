000651,|,F,|,ssApp,|,T,|,,|,False,|,False,|,False,|,,|,2 (x64),|,,|,VirtualBox,|,v7.1.8-168469,|,System;,|,System;,|,VirtualBox is a powerful virtualization product for enterprise as well as home use. Not only is VirtualBox an extremely feature rich, high performance product for enterprise customers, it is also the only professional solution that is freely available as Open Source Software under the terms of the GNU General Public License (GPL).Presently, VirtualBox runs on Windows, Linux, Macintosh and OpenSolaris hosts and supports a large number of guest operating systems including but not limited to Windows (NT 4.0, 2000, XP, Server 2003, Vista, Windows 7, 8, 8.1, and 10), DOS/Windows 3.x, Linux (2.4 and 2.6), Solaris and OpenSolaris, and OpenBSD.VirtualBox is being actively developed with frequent releases and has an ever growing list of features, supported guest operating systems and platforms it runs on. VirtualBox is a community effort backed by a dedicated company: everyone is encouraged to contribute while Sun ensures the product always meets professional quality criteria.This ssApp installs either the 32-bit or 64-bit version of VirtualBox, depending on your OS architecture.This ssApp version of VirtualBox includes the VirtualBox Extension Pack. The extension pack provides the following added functionality:- Support for a virtual USB controller (EHCI)- VirtualBox RDP: support for proprietary remote connection protocol developed by Microsoft and Citrix.- PXE boot for Intel cards[ssApp note: Method to extract the original VirtualBox installer: to extract the x86 and x64 .msi's and common.cab from the VirtualBox installer, place the .exe installer in a folder and right-click that folder and open command prompt and enter (edit .exe name accordingly):VirtualBox-7.1.8-168469-Win.exe -x -path C:\VirtualBoxSetup7This will extract the 32-bit and 64-bit .msi's and common.cab to the indicated location -- in this case, C:\VirtualBoxSetup. Alternatively, you can double-click the VirtualBox .exe without going though with the installation, and navigate to the AppData\Local\Temp folder where the .msi will be found in one of the subfolders there.]* VirtualBox isn't as stable in Linux, so if you plan on switching to Linux use Virtual Machine Manager.,|,https://www.virtualbox.org/wiki/Downloads,|,5,|,$HOME/.wine/drive_c/Program Files/Oracle/VirtualBox,|,%URLPath%/VirtualBox_v7.1.8-168469_x64_ssApp.apz,|,%DBPath%/VirtualBox_v7.1.8-168469_x64_ssApp.apz,|,,|,%DBPath%/.lldb/virtualboxssapp.png,|,613,|,%DBPath%/.lldb/virtualboxssapp.jpg,|,%DBPath%/.lldb/virtualboxssapp.png,|,,|,,|,Virtual Machine|System|Windows,|,Oracle,|,,|,4,|,,|,,|,2,|,7.1.8-168469,|,2026-01-13,|,,|,,|,133505,|,Oracle VM VirtualBox,|,Oracle VM VirtualBox,|,,|,System;,|,$HOME/.wine/drive_c/Program Files/Oracle/VirtualBox,|,VirtualBox.exe,|,,|,,|,,|,F,|,F,|,,|,,|,,|,,|,,|,,|,False,|,,|,Explorer,|,winget,|,x64,|,virtualboxssapp,|,,|,
000652,|,F,|,ppApp,|,T,|,,|,False,|,False,|,False,|,,|,2 (x64),|,,|,LosslessCut,|,v3.67,|,Video;,|,Video Editing;,|,LosslessCut is a cross platform GUI tool for lossless trimming / cutting and merging of videos using ffmpeg and electron. Great for rough processing of large video files taken from a video camera, drone, etc. Lets you quickly get rid of the useless parts. It doesn't do any decoding / encoding and is therefore very fast and has no quality loss. Also allows for taking JPEG snapshots of the video at the selected time.Lossless cutting of most video and audio formatsLosslessly cut out parts of video/audio (for cutting away commercials etc.)Lossless merge/concatenation of arbitrary files (with identical codecs parameters, e.g. from same camera)Lossless stream editing: Combine arbitrary tracks from multiple files (ex. add music or subtitle track to a video file)Losslessly extract all tracks from a file (extract video, audio, subtitle and other tracks from one file into separate files)Remux into any compatible output formatTake full-resolution snapshots from videos in JPEG/PNG formatManual input range of cutpointsApply a timecode offsetChange rotation/orientation metadata in videosView technical data about all streamsTimeline zoom and frame/keyframe jumping for accurate cutting around keyframesSaves per project cut segments to project fileView ffmpeg last command log so you can modify and re-run recent commands on the command lineUndo/redoGive labels to cut segmentsView segment details, export/import cut segments as CSVThumbnails and audio waveform,|,https://github.com/mifi/lossless-cut/releases,|,5,|,%ppApps%/LosslessCut,|,%URLPath%/LosslessCut_v3.67_x64_ppApp.apz,|,%DBPath%/LosslessCut_v3.67_x64_ppApp.apz,|,,|,%DBPath%/.lldb/losslesscutppapp.png,|,614,|,%DBPath%/.lldb/losslesscutppapp.jpg,|,%DBPath%/.lldb/losslesscutppapp.png,|,,|,keepall,|,Video,|,Online Media Technologies Ltd.,|,,|,4,|,,|,,|,3,|,3.67.2,|,2026-01-13,|,,|,,|,542675,|,Lossl