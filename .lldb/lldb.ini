000644,|,F,|,ppApp,|,T,|,,|,False,|,False,|,False,|,,|,,|,,|,Inkscape,|,v1.4.3,|,Graphics;,|,Graphics Designing; Graphics Tools;,|,Inkscape is an Open Source vector graphics editor with capabilities similar to Illustrator, Freehand, CorelDraw, or Xara X, using the W3C standard Scalable Vector Graphics (SVG) file format. Supported SVG features include shapes, paths, text, markers, clones, alpha blending, transforms, gradients, patterns, and grouping. Inkscape also supports Creative Commons meta-data, node editing, layers, complex path operations, bitmap tracing, text-on-path, flowed text, direct XML editing, and more. It imports formats such as JPEG, PNG, TIFF, and others and exports PNG as well as multiple vector-based formats.Inkscape's main goal is to create a powerful and convenient drawing tool fully compliant with XML, SVG, and CSS standards.,|,http://inkscape.org,|,5,|,%ppApps%/Inkscape,|,%URLPath%/Inkscape_v1.4.3_x64_ppApp.apz,|,%DBPath%/Inkscape_v1.4.3_x64_ppApp.apz,|,,|,%DBPath%/.lldb/inkscapeppapp.png,|,606,|,%DBPath%/.lldb/inkscapeppapp.jpg,|,%DBPath%/.lldb/inkscapeppapp.png,|,,|,keepall keepinfolder,|,Vector|Editing|Graphics,|,Inkscape,|,,|,3.5,|,,|,,|,2,|,1.4.3,|,2026-01-13,|,,|,Glenn,|,642039,|,Inkscape,|,Vector graphics editor with capabilities similar to Illustrator and CorelDraw.,|,,|,Graphics Vector;,|,%ppApps%/Inkscape,|,bin\Inkscape.exe,|,,|,,|,,|,F,|,F,|,,|,,|,,|,,|,,|,,|,False,|,,|,Explorer,|,winget,|,x64,|,inkscapeppapp,|,,|,
